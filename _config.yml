# Site settings
title: Angel Ayala | Research Fellow at FURG # site title
description: >- # site description
  He is currently a Research Fellow at Universidade Federal do Rio Grande (FURG), Brazil,
  meet the developed projects at <a href="https://github.com/angel-ayala" target="_blank" rel="noopener">@github</a>.
lang: en-US # default lang
timezone: America/Fortaleza # set your timezone
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/angel-ayala/angel-ayala.github.io # site repo [optional]
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: Angel Ayala # author name
  bio: >- # tell to the world
    👋 I am currently a Research Fellow at Universidade Federal do Rio Grande (FURG), Brazil, working on autonomous navigation and cooperative multi-agent systems involving heterogeneous aerial and underwater vehicles.
    My current research interests include AI for autonomous robotics, learning-based navigation, perception, and decision-making.
    I received my Computer Science Ph.D. from Universidade de Pernambuco, Recife, Brazil. My doctoral research focused on sample-efficient reinforcement learning and state representation learning for autonomous object-goal navigation using quadcopters, exploring bio-inspired and stochastic representations.
    Previous research addressed deep learning and computer vision approaches for fire recognition, as well as the development of autonomous UAV navigation architectures and onboard robotic systems.
  username: angel-ayala # general username
  github: angel-ayala # github username
  twitter: # twitter username
  facebook: # facebook username
  email: ange.ayala [at] furg.br # email adress
  avatar: /assets/img/perfil_cuadrado.png # change with your own avatar
  affiliation: Research Fellow at Universidade Federal do Rio Grande
  affiliation_url: https://c3.furg.br/

# URL settings
url: "https://angel-ayala.github.io" #
baseurl:
permalink: /blog/:title/
google_analytics: G-76VH142E02  # leave it blank if not wish
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5
number_of_publications: 3

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
